<title>FareHarbor Platform Map</title>
<meta name="description" content="A working map of the FareHarbor operator platform: every section, table and flow.">
<style>
/* ============================================================
   Design tokens — the single source of truth for the prototype.
   Swap these values to re-skin the entire dashboard.
   ============================================================ */
:root {
  /* Brand */
  --brand-navy:   #0b2540;
  --brand-navy-2: #133655;
  --brand-blue:   #0b7bc1;
  --brand-blue-d: #096ba8;
  --brand-cyan:   #00a0df;

  /* Semantic surfaces */
  --bg:            #f4f6f8;
  --surface:       #ffffff;
  --surface-2:     #f8fafc;
  --surface-3:     #eef2f6;
  --sidebar-bg:    #0b2540;
  --sidebar-fg:    #c7d6e5;
  --sidebar-fg-hi: #ffffff;
  --sidebar-active:#133655;

  /* Text */
  --fg:        #16222f;
  --fg-muted:  #5b6b7c;
  --fg-subtle: #8a9aab;
  --fg-invert: #ffffff;

  /* Lines */
  --border:        #dfe5ec;
  --border-strong: #c3ccd7;

  /* Accents */
  --primary:      #0b7bc1;
  --primary-fg:   #ffffff;
  --primary-soft: #e6f2fa;
  --primary-hover:#0a6ba8;

  /* Status */
  --ok:       #15803d;  --ok-soft:      #e7f6ec;
  --warn:     #b45309;  --warn-soft:    #fdf3e3;
  --danger:   #b91c1c;  --danger-soft:  #fdeceb;
  --info:     #0b7bc1;  --info-soft:    #e6f2fa;
  --neutral:  #5b6b7c;  --neutral-soft: #eef2f6;
  --purple:   #6d28d9;  --purple-soft:  #f1ebfd;

  /* Geometry */
  --r-sm: 4px; --r-md: 6px; --r-lg: 10px; --r-xl: 14px; --r-pill: 999px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

  /* Elevation */
  --sh-1: 0 1px 2px rgba(16,32,48,.06), 0 1px 3px rgba(16,32,48,.08);
  --sh-2: 0 4px 12px rgba(16,32,48,.10);
  --sh-3: 0 12px 32px rgba(16,32,48,.18);

  /* Type */
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-base: 14px;
  --fs-lg: 16px; --fs-xl: 20px; --fs-2xl: 26px; --fs-3xl: 32px;

  /* Layout */
  --sidebar-w: 232px;
  --sidebar-w-collapsed: 60px;
  --topbar-h: 52px;
  --subbar-h: 44px;
}

[data-theme="dark"] {
  --bg:            #0d141c;
  --surface:       #141d27;
  --surface-2:     #18232f;
  --surface-3:     #1e2b3a;
  --sidebar-bg:    #080f16;
  --sidebar-fg:    #93a5b8;
  --sidebar-active:#16222f;
  --fg:        #e6edf4;
  --fg-muted:  #93a5b8;
  --fg-subtle: #6b7d90;
  --border:        #24313f;
  --border-strong: #33455a;
  --primary-soft: #102f45;
  --ok-soft:     #10261a; --warn-soft: #2b2010;
  --danger-soft: #2d1414; --info-soft: #102f45;
  --neutral-soft:#1e2b3a; --purple-soft: #1e1633;
  --ok: #4ade80; --warn: #fbbf24; --danger: #f87171; --purple: #c4b5fd;
  --sh-1: 0 1px 2px rgba(0,0,0,.4);
  --sh-2: 0 4px 12px rgba(0,0,0,.45);
  --sh-3: 0 12px 32px rgba(0,0,0,.55);
}

/* ============================================================
   Base / reset / layout shell
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: var(--fs-base);
  color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased;
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
h1,h2,h3,h4,h5 { margin: 0; font-weight: 600; line-height: 1.25; }
p { margin: 0 0 var(--sp-3); }
code, .mono { font-family: var(--mono); font-size: .92em; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- App shell grid ---------- */
.app {
  display: grid; height: 100vh; overflow: hidden;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--topbar-h) 1fr;
  grid-template-areas: "brand topbar" "sidebar main";
  transition: grid-template-columns .16s ease;
}
.app.is-collapsed { grid-template-columns: var(--sidebar-w-collapsed) 1fr; }

.brandbar {
  grid-area: brand; background: var(--sidebar-bg); color: #fff;
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 0 var(--sp-3); overflow: hidden; white-space: nowrap;
}
.brandbar .logo {
  width: 26px; height: 26px; flex: none; border-radius: var(--r-sm);
  background: linear-gradient(135deg, var(--brand-cyan), var(--brand-blue));
  display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #04263c;
}
.brandbar .name { font-weight: 700; letter-spacing: .2px; font-size: var(--fs-base); }
.app.is-collapsed .brandbar .name { display: none; }

.topbar {
  grid-area: topbar; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-4);
}
.sidebar {
  grid-area: sidebar; background: var(--sidebar-bg); color: var(--sidebar-fg);
  overflow-y: auto; overflow-x: hidden; padding-bottom: var(--sp-6);
}
.main { grid-area: main; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }

/* ---------- Sidebar nav ---------- */
.nav-group { padding: var(--sp-3) 0 var(--sp-1); }
.nav-group__label {
  font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .09em;
  color: #6f8399; padding: 0 var(--sp-4) var(--sp-2); font-weight: 700;
}
.app.is-collapsed .nav-group__label { opacity: 0; height: 8px; overflow: hidden; padding: 0; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px var(--sp-4); border: 0; background: none; cursor: pointer;
  color: var(--sidebar-fg); font-size: var(--fs-md); text-align: left;
  border-left: 3px solid transparent; white-space: nowrap;
}
.nav-item:hover { background: var(--sidebar-active); color: var(--sidebar-fg-hi); text-decoration: none; }
.nav-item.is-active { background: var(--sidebar-active); color: #fff; border-left-color: var(--brand-cyan); font-weight: 600; }
.nav-item .ico { width: 18px; flex: none; text-align: center; font-size: 14px; opacity: .95; }
.nav-item .cnt {
  margin-left: auto; background: rgba(255,255,255,.14); color: #fff;
  border-radius: var(--r-pill); padding: 1px 7px; font-size: var(--fs-xs); font-weight: 700;
}
.app.is-collapsed .nav-item { justify-content: center; padding: 10px 0; }
.app.is-collapsed .nav-item .lbl,
.app.is-collapsed .nav-item .cnt { display: none; }

/* ---------- Page scaffolding ---------- */
.page { padding: var(--sp-5); max-width: 1680px; }
.page-head { display: flex; align-items: flex-start; gap: var(--sp-4); margin-bottom: var(--sp-4); flex-wrap: wrap; }
.page-head__text { min-width: 240px; flex: 1; }
.page-head h1 { font-size: var(--fs-2xl); letter-spacing: -.02em; }
.page-head .sub { color: var(--fg-muted); font-size: var(--fs-md); margin-top: 4px; }
.page-head__actions { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; min-width: 0; max-width: 100%; }

.grid { display: grid; gap: var(--sp-4); }
.grid.c2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.grid.c3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.grid.c4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.grid.c5 { grid-template-columns: repeat(5, minmax(0,1fr)); }
.grid.side { grid-template-columns: minmax(0,2fr) minmax(300px,1fr); align-items: start; }
@media (max-width: 1180px) {
  .grid.c4, .grid.c5 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid.side { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .grid.c2, .grid.c3, .grid.c4, .grid.c5 { grid-template-columns: minmax(0, 1fr); }
}

.row { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.end { justify-content: flex-end; }
.col { display: flex; flex-direction: column; gap: var(--sp-2); }
.spacer { flex: 1; }
.muted { color: var(--fg-muted); }
.subtle { color: var(--fg-subtle); }
.small { font-size: var(--fs-sm); }
.strong { font-weight: 600; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.center { text-align: center; }
.mt-0{margin-top:0}.mt-2{margin-top:var(--sp-2)}.mt-3{margin-top:var(--sp-3)}.mt-4{margin-top:var(--sp-4)}.mt-5{margin-top:var(--sp-5)}
.mb-0{margin-bottom:0}.mb-2{margin-bottom:var(--sp-2)}.mb-3{margin-bottom:var(--sp-3)}.mb-4{margin-bottom:var(--sp-4)}
.hide { display: none !important; }

/* ============================================================
   Component library
   ============================================================ */

/* ---------- Card ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh-1); }
.card__head { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); }
.card__head h3 { font-size: var(--fs-base); }
.card__head .sub { font-size: var(--fs-sm); color: var(--fg-muted); }
.card__body { padding: var(--sp-4); }
.card__body.flush { padding: 0; }
.card__foot { padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 13px; border-radius: var(--r-md); border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--fg); font-size: var(--fs-md); font-weight: 500;
  cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s, box-shadow .12s;
}
.btn:hover { background: var(--surface-3); text-decoration: none; }
.btn:active { transform: translateY(.5px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover { filter: brightness(.93); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--fg-muted); }
.btn.ghost:hover { background: var(--surface-3); color: var(--fg); }
.btn.sm { padding: 4px 9px; font-size: var(--fs-sm); }
.btn.lg { padding: 10px 18px; font-size: var(--fs-lg); }
.btn.block { width: 100%; }
.btn-group { display: inline-flex; min-width: 0; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.btn-group::-webkit-scrollbar { display: none; }
.btn-group .btn { flex: none; }
.btn-group .btn { border-radius: 0; margin-left: -1px; }
.btn-group .btn:first-child { border-radius: var(--r-md) 0 0 var(--r-md); margin-left: 0; }
.btn-group .btn:last-child { border-radius: 0 var(--r-md) var(--r-md) 0; }
.btn-group .btn.is-on { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); z-index: 1; font-weight: 600; }

/* ---------- Form controls ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label { font-size: var(--fs-sm); font-weight: 600; color: var(--fg-muted); }
.field .hint { font-size: var(--fs-xs); color: var(--fg-subtle); }
.field .err { font-size: var(--fs-xs); color: var(--danger); }
.input, .select, .textarea {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border-strong);
  border-radius: var(--r-md); background: var(--surface); color: var(--fg); font-size: var(--fs-md);
}
.input:focus, .select:focus, .textarea:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
.input.invalid, .select.invalid { border-color: var(--danger); }
.textarea { min-height: 78px; resize: vertical; }
.select { appearance: none; padding-right: 26px;
  background-image: linear-gradient(45deg, transparent 50%, var(--fg-muted) 50%), linear-gradient(135deg, var(--fg-muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 15px, calc(100% - 9px) 15px; background-size: 5px 5px; background-repeat: no-repeat; }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-md); cursor: pointer; }
.check input { width: 15px; height: 15px; accent-color: var(--primary); }
.switch { position: relative; width: 36px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .track { position: absolute; inset: 0; background: var(--border-strong); border-radius: 999px; pointer-events: none; transition: background .15s; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: var(--sh-1); }
.switch input:checked + .track { background: var(--primary); }
.switch input:checked + .track::after { transform: translateX(16px); }
.fieldset { border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--sp-4); }
.fieldset > legend { font-size: var(--fs-sm); font-weight: 700; color: var(--fg-muted); padding: 0 6px; text-transform: uppercase; letter-spacing: .05em; }

/* ---------- Badges / pills ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px;
  border-radius: var(--r-pill); font-size: var(--fs-xs); font-weight: 700;
  letter-spacing: .02em; white-space: nowrap; background: var(--neutral-soft); color: var(--neutral);
}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger)} .badge.info{background:var(--info-soft);color:var(--info)}
.badge.purple{background:var(--purple-soft);color:var(--purple)}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; font-size: var(--fs-sm);
  border: 1px solid var(--border-strong); border-radius: var(--r-pill); background: var(--surface-2);
}
.chip button { border: 0; background: none; cursor: pointer; color: var(--fg-subtle); padding: 0 2px; font-size: 14px; line-height: 1; }
.chip button:hover { color: var(--danger); }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button {
  border: 0; background: none; padding: 9px 14px; cursor: pointer; font-size: var(--fs-md);
  color: var(--fg-muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500;
}
.tabs button:hover { color: var(--fg); }
.tabs button.is-active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.tabs .cnt { margin-left: 6px; font-size: var(--fs-xs); background: var(--surface-3); border-radius: var(--r-pill); padding: 1px 6px; }

/* ---------- Data table ---------- */
.dt { display: flex; flex-direction: column; min-width: 0; }
.dt__toolbar { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.dt__search { position: relative; flex: 1; min-width: 180px; max-width: 340px; }
.dt__search .input { padding-left: 30px; }
.dt__search::before { content: "⌕"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--fg-subtle); font-size: 15px; }
.dt__scroll { overflow-x: auto; }
table.dt__table { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
table.dt__table th {
  text-align: left; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em;
  color: var(--fg-muted); font-weight: 700; padding: 9px var(--sp-3); border-bottom: 1px solid var(--border);
  background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; z-index: 2;
}
table.dt__table th.sortable { cursor: pointer; user-select: none; }
table.dt__table th.sortable:hover { color: var(--fg); }
table.dt__table th .arrow { opacity: .45; margin-left: 4px; }
table.dt__table th.is-sorted .arrow { opacity: 1; color: var(--primary); }
table.dt__table td { padding: 9px var(--sp-3); border-bottom: 1px solid var(--border); vertical-align: middle; }
table.dt__table tbody tr:hover { background: var(--surface-2); }
table.dt__table tbody tr.is-selected { background: var(--primary-soft); }
table.dt__table tbody tr.clickable { cursor: pointer; }
table.dt__table td.num, table.dt__table th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.dt__table tfoot td { font-weight: 700; background: var(--surface-2); border-top: 2px solid var(--border-strong); }
.dt__foot { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3); flex-wrap: wrap; }
.dt__empty { padding: var(--sp-7) var(--sp-4); text-align: center; color: var(--fg-muted); }
.dt__empty .big { font-size: 30px; opacity: .35; margin-bottom: var(--sp-2); }

/* ---------- Stat tiles ---------- */
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--sp-4); box-shadow: var(--sh-1); }
.stat__label { font-size: var(--fs-sm); color: var(--fg-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.stat__value { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat__delta { font-size: var(--fs-sm); font-weight: 600; margin-top: 2px; }
.stat__delta.up { color: var(--ok); } .stat__delta.down { color: var(--danger); }
.stat__spark { margin-top: var(--sp-2); }

/* ---------- Progress / meters ---------- */
.meter { height: 6px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .3s; }
.meter.ok > i { background: var(--ok); } .meter.warn > i { background: var(--warn); } .meter.danger > i { background: var(--danger); }

/* ---------- Drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(11,37,64,.42); z-index: 60; animation: fade .14s ease; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 96vw); background: var(--surface);
  z-index: 61; box-shadow: var(--sh-3); display: flex; flex-direction: column; animation: slidein .18s ease;
}
.drawer.wide { width: min(1080px, 98vw); }
@keyframes slidein { from { transform: translateX(24px); opacity: .6 } to { transform: none; opacity: 1 } }
.drawer__head { display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-4); border-bottom: 1px solid var(--border); }
.drawer__head h2 { font-size: var(--fs-xl); }
.drawer__body { flex: 1; overflow-y: auto; padding: var(--sp-4); }
.drawer__body.flush { padding: 0; }
.drawer__foot { padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--border); background: var(--surface-2); display: flex; gap: var(--sp-2); justify-content: flex-end; }

/* ---------- Modal ---------- */
.modal {
  position: fixed; z-index: 61; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: min(620px, 94vw); max-height: 88vh; background: var(--surface); border-radius: var(--r-xl);
  box-shadow: var(--sh-3); display: flex; flex-direction: column; animation: pop .14s ease;
}
.modal.wide { width: min(980px, 96vw); }
@keyframes pop { from { transform: translate(-50%,-48%) scale(.98); opacity: 0 } to { transform: translate(-50%,-50%) scale(1); opacity: 1 } }
.modal__head { padding: var(--sp-4); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--sp-3); }
.modal__body { padding: var(--sp-4); overflow-y: auto; }
.modal__foot { padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--border); background: var(--surface-2); display: flex; gap: var(--sp-2); justify-content: flex-end; border-radius: 0 0 var(--r-xl) var(--r-xl); }

/* ---------- Toasts ---------- */
.toasts { position: fixed; right: var(--sp-4); bottom: var(--sp-4); z-index: 80; display: flex; flex-direction: column; gap: var(--sp-2); }
.toast {
  background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--primary);
  border-radius: var(--r-md); box-shadow: var(--sh-2); padding: 10px var(--sp-3); min-width: 260px; max-width: 400px;
  font-size: var(--fs-md); animation: slidein .16s ease;
}
.toast.ok { border-left-color: var(--ok); } .toast.danger { border-left-color: var(--danger); } .toast.warn { border-left-color: var(--warn); }
.toast .t { font-weight: 600; }
.toast .d { color: var(--fg-muted); font-size: var(--fs-sm); margin-top: 2px; }

/* ---------- Key/value ---------- */
.kv { display: grid; grid-template-columns: minmax(120px, 34%) 1fr; gap: 7px var(--sp-3); font-size: var(--fs-md); align-items: baseline; }
.kv dt { color: var(--fg-muted); font-weight: 500; }
.kv dd { margin: 0; }

/* ---------- Timeline ---------- */
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.timeline li { position: relative; padding: 0 0 var(--sp-4) 26px; font-size: var(--fs-md); }
.timeline li::before { content: ""; position: absolute; left: 2px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border-strong); }
.timeline li.ok::before { border-color: var(--ok); } .timeline li.danger::before { border-color: var(--danger); }
.timeline li.info::before { border-color: var(--primary); } .timeline li.warn::before { border-color: var(--warn); }
.timeline .when { color: var(--fg-subtle); font-size: var(--fs-xs); }

/* ---------- Calendar ---------- */
.cal { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); }
.cal__dow { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--surface-2); border-bottom: 1px solid var(--border); }
.cal__dow div { padding: 7px; text-align: center; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--fg-muted); font-weight: 700; }
.cal__grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal__cell { min-height: 118px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 5px; cursor: pointer; position: relative; }
.cal__cell:nth-child(7n) { border-right: 0; }
.cal__cell.other { background: var(--surface-2); opacity: .6; }
.cal__cell.today .cal__num { background: var(--primary); color: #fff; border-radius: 50%; }
.cal__cell.is-sel { box-shadow: inset 0 0 0 2px var(--primary); }
.cal__cell:hover { background: var(--surface-2); }
.cal__num { display: inline-grid; place-items: center; width: 21px; height: 21px; font-size: var(--fs-sm); font-weight: 600; }
.cal__ev { display: block; width: 100%; text-align: left; border: 0; cursor: pointer; font-size: var(--fs-xs); padding: 2px 5px; border-radius: var(--r-sm); margin-top: 2px; background: var(--info-soft); color: var(--info); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.cal__ev.full { background: var(--danger-soft); color: var(--danger); }
.cal__ev.tight { background: var(--warn-soft); color: var(--warn); }
.cal__ev.open { background: var(--ok-soft); color: var(--ok); }
.cal__ev.cancelled { background: var(--neutral-soft); color: var(--neutral); text-decoration: line-through; }
.cal__more { font-size: var(--fs-xs); color: var(--fg-subtle); padding-left: 5px; }

/* ---------- Schedule (day view) ---------- */
.sched { display: grid; grid-template-columns: 62px 1fr; font-size: var(--fs-md); }
.sched__hour { border-top: 1px solid var(--border); padding: 4px 8px; color: var(--fg-subtle); font-size: var(--fs-xs); text-align: right; }
.sched__lane { border-top: 1px solid var(--border); border-left: 1px solid var(--border); min-height: 52px; padding: 4px; display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }

/* ---------- Misc ---------- */
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: var(--fs-sm); font-weight: 700; background: var(--primary-soft); color: var(--primary); flex: none; }
.avatar.sm { width: 22px; height: 22px; font-size: var(--fs-xs); }
.divider { height: 1px; background: var(--border); margin: var(--sp-4) 0; }
.code-block { background: var(--surface-3); border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--sp-3); font-family: var(--mono); font-size: var(--fs-sm); overflow-x: auto; white-space: pre; }
.banner { display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface-2); font-size: var(--fs-md); }
.banner.info { background: var(--info-soft); border-color: transparent; color: var(--info); }
.banner.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.banner.danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.banner.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.searchbox { position: relative; flex: 1; max-width: 460px; }
.searchbox .input { padding-left: 30px; background: var(--surface-2); }
.searchbox::before { content: "⌕"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--fg-subtle); font-size: 15px; }
.omni { position: absolute; top: 110%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--sh-3); z-index: 70; max-height: 420px; overflow-y: auto; }
.omni__item { display: flex; gap: var(--sp-3); align-items: center; padding: 8px var(--sp-3); cursor: pointer; border: 0; background: none; width: 100%; text-align: left; font-size: var(--fs-md); }
.omni__item:hover, .omni__item.is-active { background: var(--primary-soft); }
.omni__sec { padding: 6px var(--sp-3); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .07em; color: var(--fg-subtle); font-weight: 700; background: var(--surface-2); }
.menu { position: absolute; z-index: 70; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--sh-3); min-width: 190px; padding: 4px; }
.menu button { display: flex; gap: 8px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: var(--r-sm); cursor: pointer; font-size: var(--fs-md); }
.menu button:hover { background: var(--surface-3); }
.menu button.danger { color: var(--danger); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.stepper { display: flex; align-items: center; gap: var(--sp-2); }
.stepper__step { display: flex; align-items: center; gap: 7px; font-size: var(--fs-md); color: var(--fg-subtle); }
.stepper__step .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); font-size: var(--fs-xs); font-weight: 700; }
.stepper__step.is-active { color: var(--fg); font-weight: 600; }
.stepper__step.is-active .n { background: var(--primary); color: #fff; }
.stepper__step.is-done .n { background: var(--ok); color: #fff; }
.stepper__sep { width: 22px; height: 1px; background: var(--border-strong); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: var(--r-md); overflow: hidden; }
.qty button { width: 30px; height: 30px; border: 0; background: var(--surface-2); cursor: pointer; font-size: 15px; }
.qty button:hover { background: var(--surface-3); }
.qty span { min-width: 34px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.split { display: grid; grid-template-columns: 240px 1fr; gap: var(--sp-5); align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.sidenav { display: flex; flex-direction: column; gap: 1px; position: sticky; top: var(--sp-4); }
.sidenav button { text-align: left; border: 0; background: none; padding: 7px var(--sp-3); border-radius: var(--r-md); cursor: pointer; font-size: var(--fs-md); color: var(--fg-muted); }
.sidenav button:hover { background: var(--surface-3); color: var(--fg); }
.sidenav button.is-active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.sidenav .sec { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .07em; color: var(--fg-subtle); font-weight: 700; padding: var(--sp-3) var(--sp-3) 4px; }

topic).add(fn);\n      return () => topics.get(topic)?.delete(fn);\n    },\n    emit(topic, payload) {\n      for (const fn of [...(topics.get(topic) || [])]) fn(payload);\n      for (const fn of [...(topics.get('*') || [])]) fn({ topic, payload });\n    },\n  };\n}\n\n/** Persist a slice of state to localStorage (used for prefs only). */\nexport function persisted(key, fallback) {\n  try {\n    const raw = localStorage.getItem(key);\n    return raw ? JSON.parse(raw) : fallback;\n  } catch { return fallback; }\n}\nexport function persist(key, value) {\n  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private mode */ }\n}\n","app/core/router.js":"/**\n * router.js — hash router.  #/<module>/<sub>/<id>?a=1&b=2\n * The whole app is addressable: every table filter, tab and record\n * lives in the URL so any screen can be linked to or reloaded.\n */\nexport function createRouter(onChange) {\n  const parse = () => {\n    const raw = location.hash.replace(/^#\\/?/, '');\n    const [pathPart, queryPart] = raw.split('?');\n    const segments = pathPart.split('/').filter(Boolean).map(decodeURIComponent);\n    const query = {};\n    new URLSearchParams(queryPart || '').forEach((v, k) => { query[k] = v; });\n    return {\n      segments,\n      module: segments[0] || 'home',\n      sub: segments[1] || null,\n      id: segments[2] || null,\n      rest: segments.slice(3),\n      query,\n      path: '/' + segments.join('/'),\n    };\n  };\n\n  let current = parse();\n  const fire = () => { current = parse(); onChange(current); };\n  window.addEventListener('hashchange', fire);\n\n  return {\n    get current() { return current; },\n    start() { if (!location.hash) location.hash = '#/home'; else fire(); },\n    /** Navigate. `query` replaces the querystring entirely. */\n    go(path, query) {\n      const qs = query && Object.keys(query).length\n        ? '?' + new URLSearchParams(\n            Object.entries(query).filter(([, v]) => v !== '' && v != null)).to itle, sub, path, kind }],\n *     commands:(ctx) => [{ title, path, run }],\n *   }\n *\n * To add a section: drop a file in app/modules/, add it to MODULES in main.js.\n * To remove one: delete the import. Nothing else changes.\n */\n\nexport function createRegistry() {\n  const byId = new Map();\n\n  return {\n    register(mod) {\n      if (!mod || !mod.id) throw new Error('Module needs an id');\n      if (typeof mod.render !== 'function') throw new Error(`Module \"${mod.id}\" needs render()`);\n      byId.set(mod.id, { group: 'General', order: 100, icon: '•', ...mod });\n      return this;\n    },\n    registerAll(mods) { mods.forEach(m => this.register(m)); return this; },\n    get(id) { return byId.get(id); },\n    has(id) { return byId.has(id); },\n    all() { return [...byId.values()]; },\n\n    /** Sidebar tree: [{ group, items: [module] }] in declared group order. */\n    nav() {\n      const groups = new Map();\n      for (const m of byId.values()) {\n        if (m.hidden) continue;\n        if (!groups.has(m.group)) groups.set(m.group, []);\n        groups.get(m.group).push(m);\n      }\n      return [...groups.entries()].map(([group, items]) => ({\n        group,\n        items: items.sort((a, b) => a.order - b.order || a.title.localeCompare(b.title)),\n      }));\n    },\n\n    /** Fan a query out to every module that opts into global search. */\n    search(q, ctx, limit = 24) {\n      if (!q || q.trim().length < 1) return [];\n      const out = [];\n      for (const m of byId.values()) {\n        if (typeof m.search !== 'function') continue;\n        try {\n          for (const r of (m.search(q, ctx) || [])) {\n            out.push({ module: m.id, moduleTitle: m.title, icon: m.icon, ...r });\n          }\n        } catch (e) { console.warn(`search failed in ${m.id}`, e); }\n      }\n      return out.slice(0, limit);\n    },\n\n    /** Command palette entries: navigation for every module + module-supplied verbs. */\n    commands(ctx) {\n      const out = [];\n      for (const m of byId.values()) {\n        out.push({ title: `Go to ${m.title}`, hint: m.group, path: `/${m.id}`, icon: m.icon });\n        if (typeof m.commands === 'function') {\n          try { for (const c of (m.commands(ctx) || [])) out.push({ icon: m.icon, hint: m.title, ...c }); }\n          catch (e) { console.warn(`commands failed in ${m.id}`, e); }\n        }\n      }\n      return out;\n    },\n  };\n}\n","app/core/format.js":"/** format.js — display formatting used everywhere. */\n\nexport const CURRENCY = { code: 'USD', symbol: '$' };\n\nexport function money(cents, { sign = false, blankZero = false } = {}) {\n  if (cents == null || Number.isNaN(cents)) return '—';\n  if (blankZero && cents === 0) return '—';\n  const neg = cents < 0;\n  const s = (Math.abs(cents) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n  return `${neg ? '-' : sign ? '+' : ''}${CURRENCY.symbol}${s}`;\n}\nexport function moneyShort(cents) {\n  const v = (cents || 0) / 100;\n  if (Math.abs(v) >= 1_000_000) return CURRENCY.symbol + (v / 1_000_000).toFixed(1) + 'M';\n  if (Math.abs(v) >= 1_000) return CURRENCY.symbol + (v / 1_000).toFixed(1) + 'k';\n  return CURRENCY.symbol + v.toFixed(0);\n}\nexport const num = (n) => (n ?? 0).toLocaleString('en-US');\nexport const pct = (n, digits = 0) => `${(n * 100).toFixed(digits)}%`;\n\n/* ---------- dates: all internal dates are 'YYYY-MM-DD', times 'HH:MM' ---------- */\nexport const today = () => toISO(new Date());\nexport function toISO(d) {\n  const dt = d instanceof Date ? d : new Date(d);\n  return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;\n}\nexport const pad = (n) => String(n).padStart(2, '0');\nexport function parseISO(iso) {\n  const [y, m, d] = String(iso).split('-').map(Number);\n  return new Date(y, (m || 1) - 1, d || 1);\n}\nexport function addDays(iso, n) {\n  const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d);\n}\nexport function addMonths(iso, n) {\n  const d = parseISO(iso); d.setMonth(d.getMonth() + n); return toISO(d);\n}\nexport function diffDays(a, b) {\n  return Math.round((parseISO(b) - parseISO(a)) / 86400000);\n}\nexport function startOfWeek(iso) { return addDays(iso, -parseISO(iso).getDay()); }\nexport function startOfMonth(iso) { return iso.slice(0, 8) + '01'; }\n\nconst MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];\nconst DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\n\nexport function dateShort(iso) { if (!iso) return '—'; const d = parseISO(iso); return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }\nexport function dateMed(iso)   { if (!iso) return '—'; const d = parseISO(iso); return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; }\nexport function dateLong(iso)  { if (!iso) return '—'; const d = parseISO(iso); return `${DOW[d.getDay()]}, ${MONL[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }\nexport function monthLabel(iso){ const d = parseISO(iso); return `${MONL[d.getMonth()]} ${d.getFullYear()}`; }\nexport const monthName = (i) => MONL[i];\nexport const dowName = (i) => DOW[i];\n\nexport function time12(hhmm) {\n  if (!hhmm) return '—';\n  const [H, M] = hhmm.split(':').map(Number);\n  const ap = H >= 12 ? 'pm' : 'am';\n  const h = H % 12 === 0 ? 12 : H % 12;\n  return `${h}:${pad(M)}${ap}`;\n}\nexport function dateTime(iso, hhmm) { return `${dateShort(iso)} · ${time12(hhmm)}`; }\n\n/** '2 hours ago', 'in 3 days' — relative to now. */\nexport function relative(isoDateTime) {\n  const then = new Date(isoDateTime).getTime();\n  if (Number.isNaN(then)) return '—';\n  const secs = Math.round((then - Date.now()) / 1000);\n  const abs = Math.abs(secs);\n  const units = [[60,'second'],[3600,'minute'],[86400,'hour'],[604800,'day'],[2629800,'week'],[31557600,'month']];\n  let n = abs, unit = 'year';\n  for (let i = 0; i < units.length; i++) {\n    if (abs < units[i][0]) { n = Math.round(abs / (i === 0 ? 1 : units[i-1][0])); unit = units[i][1]; break; }\n    if (i === units.length - 1) { n = Math.round(abs / units[i][0]); unit = 'year'; }\n  }\n  const label = `${n} ${unit}${n === 1 ? '' : 's'}`;\n  return secs < 0 ? `${label} ago` : `in ${label}`;\n}\n\nexport function duration(minutes) {\n  if (minutes == null) return '—';\n  const h = Math.floor(minutes / 60), m = minutes % 60;\n  return h && m ? `${h}h ${m}m` : h ? `${h}h` : `${m}m`;\n}\nexport function initials(name) {\n  return String(name || '?').trim().split(/\\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();\n}\nexport function titleCase(s) {\n  return String(s || '').replace(/[_-]+/g, ' ').replace(/\\b\\w/g, c => c.toUpperCase());\n}\nexport function truncate(s, n = 60) {\n  s = String(s ?? ''); return s.length > n ? s.slice(0, n - 1) + '…' : s;\n}\nexport function phone(p) {\n  const d = String(p || '').replace(/\\D/g, '');\n  return d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : p || '—';\n}\n","app/data/seed.js":"/**\n * seed.js — deterministic demo dataset.\n *\n * Same seed => same data on every reload, so screenshots and links are stable.\n * Everything reconciles: booking totals equal the sum of their customers plus\n * taxes minus discounts; payouts equal the payments they contain; availability\n * `booked` counts equal the pax actually on their bookings.\n */\nimport { toISO, addDays, today, pad } from '../core/format.js';\n\n/* ---------------------------------------------------------- randomness */\nfunction rng(seed) {\n  let a = seed >>> 0;\n  return () => {\n    a = (a + 0x6D2B79F5) >>> 0;\n    let t = Math.imul(a ^ (a >>> 15), 1 | a);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nexport function generate(seed = 20260830) {\n  const R = rng(seed);\n  const int = (lo, hi) => lo + Math.floor(R() * (hi - lo + 1));\n  const pick = (arr) => arr[Math.floor(R() * arr.length)];\n  const weighted = (pairs) => {                  // [[value, weight], ...]\n    const total = pairs.reduce((s, p) => s + p[1], 0);\n    let r = R() * total;\n    for (const [v, w] of pairs) { if ((r -= w) <= 0) return v; }\n    return pairs[pairs.length - 1][0];\n  };\n  const chance = (p) => R() < p;\n  const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };\n  const counter = {};\n  const id = (t) => `${t}_${String(counter[t] = (counter[t] || 0) + 1).padStart(5, '0')}`;\n\n  const T0 = today();\n  const dtOffset = (days, hour = int(8, 19)) =>\n    `${addDays(T0, days)}T${pad(hour)}:${pad(int(0, 59))}:00`;\n\n  /* ------------------------------------------------------------ vocab */\n  const FIRST = ['Maya','Liam','Sofia','Noah','Ava','Ethan','Isla','Kai','Nora','Owen','Ruby','Leo','Zoe','Mateo','Hazel','Felix','Iris','Jonah','Elena','Rhys','Priya','Tomas','Anika','Callum','Yuki','Diego','Freya','Omar','Lena','Beau','Sana','Marcus','Ingrid','Theo','Camille','Hugo','Nadia','Silas','Amara','Jasper'];\n  const LAST = ['Okafor','Nakamura','Delgado','Whitfield','Byrne','Halvorsen','Ferreira','Mbeki','Larsen','Costa','Ahmadi','Sinclair','Prasad','Novak','Rivera','Ellison','Tanaka','Bouchard','Grimaldi','Osei','Vasquez','Lindqvist','Marchetti','Odell','Kowalski','Bright','Ferris','Achebe','Solberg','Ibarra','Kaur','Renner','Duarte','Fontaine','Hollis','Mensah','Petrov','Quill','Salazar','Trevino'];\n  const CITIES = [['Portland','US'],['Austin','US'],['Toronto','CA'],['London','GB'],['Sydney','AU'],['Berlin','DE'],['Denver','US'],['Chicago','US'],['Dublin','IE'],['Auckland','NZ'],['Vancouver','CA'],['Lisbon','PT'],['Seattle','US'],['Amsterdam','NL'],['Osaka','JP'],['Boston','US'],['Barcelona','ES'],['Oslo','NO']];\n  const DOMAINS = ['gmail.com','outlook.com','icl o cost.'],\n  ].map(([name, cutoff_hours, refund_pct, description]) => add('cancellation_policy', {\n    pk: id('cancellation_policy'), company: CO, name, cutoff_hours, refund_pct: refund_pct / 100, description,\n  }));\n\n  /* --------------------------------------------------- customer types */\n  const CT_DEFS = [\n    ['Adult', 'Adults', 'Ages 13+', true],\n    ['Child', 'Children', 'Ages 4–12', true],\n    ['Infant', 'Infants', 'Under 4, on a lap', false],\n    ['Senior', 'Seniors', 'Ages 65+', true],\n    ['Student', 'Students', 'Valid ID required', true],\n    ['Observer', 'Observers', 'Rides along, does not participate', true],\n  ];\n  const ctypes = CT_DEFS.map(([singular, plural, note, counts]) => add('customer_type', {\n    pk: id('customer_type'), company: CO, singular, plural, note, counts_against_capacity: counts,\n  }));\n\n  /* ------------------------------------------------------------ items */\n  const ITEM_DEFS = [\n    ['Sunset Harbor Cruise', 'tour', 120, 48, 5200, 1, [0,1,3], 0],\n    ['Columbia Bar Jet Boat Run', 'tour', 90, 24, 8900, 2, [0,1,3], 1],\n    ['Cape Lighthouse Hike', 'tour', 180, 16, 4500, 0, [0,1,4], 2],\n    ['Half-Day Sea Kayak Tour', 'tour', 240, 12, 11500, 1, [0,1], 3],\n    ['Whale Watching Expedition', 'tour', 210, 40, 9800, 1, [0,1,3], 0],\n    ['Private Charter — 6 Guests', 'charter', 240, 6, 68000, 2, [0], 4],\n    ['Kayak Rental — Full Day', 'rental', 480, 30, 6500, 0, [0], 3],\n    ['E-Bike Rental — 4 Hours', 'rental', 240, 20, 4200, 0, [0], 3],\n    ['Stand-Up Paddleboard Rental', 'rental', 180, 18, 3500, 0, [0], 3],\n    ['Intro to Sea Kayaking Lesson', 'lesson', 150, 8, 8500, 1, [0,1], 3],\n    ['Tide Pool Naturalist Walk', 'tour', 90, 20, 2800, 0, [0,1,3], 2],\n    ['Maritime Museum Admission', 'ticket', 0, 200, 1800, 0, [0,1,3,4], 0],\n    ['Lighthouse Night Photography', 'event', 180, 10, 12500, 2, [0,1], 2],\n    ['Crabbing & Cook-Out', 'tour', 300, 18, 14500, 1, [0,1,3], 1],\n  ];\n  const items = ITEM_DEFS.map(([name, category, duration_minutes, capacity_default, basePrice, policyIdx, ctIdx, locIdx], i) => {\n    const it = add('item', {\n      pk: id('item'), company: CO, name,\n      slug: name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''),\n      category,\n      status: i === 12 ? 'draft' : i === 11 && chance(.4) ? 'paused' : 'live',\n      headline: {\n        tour: 'Small groups, local guides, and the best light on the river.',\n        rental: 'Grab your gear and go — helmets, vests and a route map included.',\n        lesson: 'Coached from the beach out to open water. No experience needed.',\n        ticket: 'Skip the line with a timed-entry ticket.',\n        charter: 'The whole boat, your itinerary, our captain.',\n        event: 'A limited-seat evening for a very specific kind of nerd.',\n      }[category],\n      description: 'Departs from the ticket office. Bring layers, closed-toe shoes and a water bottle. '\n        + 'Restrooms and paid parking are on site. We run rain or shine; only lightning cancels a departure.',\n      duration_minutes,\n      capacity_default,\n      min_party: category === 'charter' ? 4 : 1,\n      max_party: category === 'charter' ? 6 : 12,\n      location: locations[locIdx].pk,\n      cancellation_policy: policies[policyIdx].pk,\n      booking_cutoff_minutes: [0, 60, 120, 1440][int(0, 3)],\n      requires_waiver: ['tour', 'rental', 'lesson', 'charter'].includes(category),\n      online_booking: i !== 12,\n      deposit_pct: category === 'charter' ? 0.25 : 0,\n      image: '',\n      sort_order: i,\n      _basePrice: basePrice, _ctIdx: ctIdx,\n    });\n    return it;\n  });\n  const liveItems = items.filter(i => i.status === 'live');\n\n  /* ------------------------------------------------------------ rates */\n  const rates = [];\n  const ratesByItem = {};\n  for (const it of items) {\n    ratesByItem[it.pk] = [];\n    it._ctIdx.forEach((ci, n) => {\n      const mult = [1, 0.62, 0, 0.85, 0.75, 0.5][ci];\n 'Last delivery'),\n    f('failures_24h', 'int', 'Failures 24h'),\n  ]),\n\n  T('activity_log', 'Activity log', 'System',\n    'Immutable audit trail. Who changed what, when, and what the value was before.', [\n    f('pk', 'id', 'ID'),\n    f('company', 'ref', 'Company', { ref: 'company' }),\n    f('actor', 'ref', 'User', { ref: 'user' }),\n    f('action', 'string', 'Action'),\n    f('target_type', 'string', 'Object type'),\n    f('target', 'string', 'Object'),\n    f('detail', 'string', 'Detail'),\n    f('created_at', 'datetime', 'When'),\n    f('ip_address', 'string', 'IP'),\n  ]),\n\n  T('saved_report', 'Saved reports', 'System',\n    'A stored report definition — columns, filters, grouping — optionally emailed on a schedule.', [\n    f('pk', 'id', 'ID'),\n    f('company', 'ref', 'Company', { ref: 'company' }),\n    f('name', 'string', 'Report'),\n    f('base', 'enum', 'Dataset', { enum: ['bookings', 'payments', 'payouts', 'items', 'contacts', 'availability'] }),\n    f('columns', 'array', 'Columns'),\n    f('filters', 'json', 'Filters'),\n    f('group_by', 'string', 'Grouped by'),\n    f('schedule', 'enum', 'Delivery', { enum: ['none', 'daily', 'weekly', 'monthly'] }),\n    f('recipients', 'array', 'Emailed to'),\n    f('owner', 'ref', 'Owner', { ref: 'user' }),\n  ]),\n];\n\n/* -------------------------------------------------------------- helpers */\nexport const TABLES = Object.fromEntries(SCHEMA.map(t => [t.id, t]));\nexport const tableIds = () => SCHEMA.map(t => t.id);\nexport const table = (id) => TABLES[id];\nexport const field = (tableId, name) => TABLES[tableId]?.fields.find(f => f.name === name);\n\n/** Every foreign-key edge in the model — powers the relationship diagram. */\nexport function relationships() {\n  const edges = [];\n  for (const t of SCHEMA)\n    for (const fl of t.fields)\n      if (fl.type === 'ref' && fl.ref) edges.push({ from: t.id, to: fl.ref, via: fl.name, label: fl.label });\n  return edges;\n}\n/** Tables that point at `id`. */\nexport const dependents = (id) => relationships().filter(e => e.to === id);\n","app/data/db.js":"/**\n * db.js — an in-memory database with the query surface the UI needs.\n *\n * Modules never reach into raw arrays; they call query()/get()/rel(). That means\n * the same screens work unchanged if the arrays are later swapped for fetch()\n * against a real API — only this file would change.\n */\nimport { generate } from './seed.js';\nimport { SCHEMA, TABLES } from './schema.js';\n\n/** Human-readable label for a row, per table. Used anywhere a ref is displayed. */\nconst LABELERS = {\n  company: r => r.name, location: r => r.name, user: r => r.name, role: r => r.name,\n  item: r => r.name, customer_type: r => r.singular, contact: r => r.name,\n  booking: r => r.code, affiliate: r => r.name, channel: r => r.name,\n  resource: r => r.name, lodging: r => r.name, promo_code: r => r.code,\n  gift_card: r => r.code, membership_type: r => r.name, waiver_template: r => r.name,\n  message_template: r => r.name, cancellation_policy: r => r.name, tax_fee: r => r.name,\n  payout: r => r.reference, widget: r => r.name, api_key: r => r.name,\n  availability: r => `${r.date} ${r.start_time}`,\n  customer_type_rate: r => r.pk, booking_customer: r => r.name,\n  custom_field: r => r.title, saved_report: r => r.name, task: r => r.title,\n};\n\nexport function createDb(store, seed = 20260830) {\n  const data = generate(seed);\n  for (const t of SCHEMA) data[t.id] ||= [];\n\n  // pk -> row, per table\n  const index = {};\n  const reindex = (t) => { index[t] = new Map(data[t].map(r => [r.pk, r])); };\n  for (const t of Object.keys(data)) reindex(t);\n\n  let uid = 900000;\n  const nextPk = (t) => `${t}_${++uid}`;\n\n  const db = {\n    /* ------------------------------------------------------------ read */\n    tables: () => SCHEMA.map(t => t.id),\n    all: (t) => data[t] || [],\n    count: (t) => (data[t] || []).length,\n    get: (t, pk) => (pk == null ? null : index[t]?.get(pk) || null),\n    find: (t, pred) => (data[t] || []).find(pred) || null,\n    where: (t, pred) => (data[t] || []).filter(typeof pred === 'function' ? pred : matcher(pred)),\n\n    /** Resolve a foreign key: rel(booking, 'item') -> the item row. */\n    rel(row, fieldName) {\n      if (!row) return null;\n      const tableId = tableOf(row);\n      const fl = TABLES[tableId]?.fields.find(f => f.name === fieldName);\n      if (!fl?.ref) return null;\n      return db.get(fl.ref, row[fieldName]);\n    },\n    /** Rows in `t` whose `fieldName` points at `pk`. */\n    children: (t, fieldName, pk) => (data[t] || []).filter(r => r[fieldName] === pk),\n\n    /** Display label for a row or a (table, pk) pair. */\n    label(t, pkOrRow) {\n      const row = typeof pkOrRow === 'string' ? db.get(t, pkOrRow) : pkOrRow;\n      if (!row) return '—';\n      return String((LABELERS[t] || (r => r.name || r.title || r.pk))(row));\n    },\n\n    /**\n     * The workhorse. Returns { rows, total, page, pages }.\n     *   filter : object of field->value | [values] | {op:'gte'|'lte'|'between'|'ne'|'in', value}\n     *            or a predicate function\n     *   search : substring match across `searchFields` (defaults to every text-ish field)\n     *   sort   : field name, `dir` 'asc'|'desc'\n     *   page / pageSize : 1-based; pageSize 0 disables paging\n     */\n    query(t, {\n      filter = null, search = '', searchFields = null,\n      sort = null, dir = 'asc', page = 1, pageSize = 25,\n    } = {}) {\n      let rows = data[t] || [];\n\n      if (filter) rows = rows.filter(typeof filter === 'function' ? filter : matcher(filter));\n\n      const q = String(search || '').trim().toLowerCase();\n      if (q) {\n        const fields = searchFields || defaultSearchFields(t);\n        rows = rows.filter(r => fields.some(fn => {\n          const v = r[fn];\n          if (v == null) return false;\n          return String(Array.isArray(v) ? v.join(' ') : v).toLowerCase().includes(q);\n        }));\n      }\n\n      const total = rows.length;\n      if (sort) {\n        const numeric = isNumericField(t, sort);\n        rows = [...rows].sort((a, b) => {\n          const av = a[sort], bv = b[sort];\n          if (av == null && bv == null) return 0;\n          if (av == null) return 1;\n          if (bv == null) return -1;\n          const c = numeric ? av - bv : String(av).localeCompare(String(bv), undefined, { numeric: true });\n          return dir === 'desc' ? -c : c;\n        });\n      }\n\n      const pages = pageSize ? Math.max(1, Math.ceil(total / pageSize)) : 1;\n      const p = Math.min(Math.max(1, page), pages);\n      const paged = pageSize ? rows.slice((p - 1) * pageSize, p * pageSize) : rows;\n      return { rows: paged, total, page: p, pages, allRows: rows };\n    },\n\n    /** Group rows and reduce — the primitive behind every report. */\n    groupBy(rows, keyFn, reducers) {\n      const groups = new Map();\n      for (const r of rows) {\n        const k = keyFn(r);\n        if (k == null) continue;\n        if (!groups.has(k)) groups.set(k, []);\n        groups.get(k).push(r);\n      }\n      return [...groups.entries()].map(([key, items]) => {\n        const acc = { key, count: items.length, items };\n        for (const [name, fn] of Object.entries(reducers || {})) acc[name] = fn(items);\n        return acc;\n      });\n    },\n    sum: (rows, field) => rows.reduce((s, r) => s + (Number(r[field]) || 0), 0),\n\n    /* ----------------------------------------------------------- write */\n    insert(t, row, { log = true } = {}) {\n      const rec = { pk: row.pk || nextPk(t), ...row };\n      (data[t] ||= []).push(rec);\n      (index[t] ||= new Map()).set(rec.pk, rec);\n      if (log) audit('create', t, rec);\n      store?.emit('db:change', { table: t, op: 'insert', row: rec });\n      return rec;\n    },\n    update(t, pk, patch, { log = true } = {}) {\n      const rec = db.get(t, pk);\n      if (!rec) return null;\n      Object.assign(rec, patch);\n      if (log) audit('update', t, rec, Object.keys(patch).join(', '));\n      store?.emit('db:change', { table: t, op: 'update', row: rec });\n      return rec;\n    },\n    remove(t, pk, { log = true } = {}) {\n      const i = (data[t] || []).findIndex(r => r.pk === pk);\n      if (i < 0) return false;\n      const [rec] = data[t].splice(i, 1);\n      index[t].delete(pk);\n      if (log) audit('delete', t, rec);\n      store?.emit('db:change', { table: t, op: 'delete', row: rec });\n      return true;\n    },\n\n    /** Reset to a fresh generated dataset (used by the Reset demo data action). */\n    reset(newSeed = seed) {\n      const fresh = generate(newSeed);\n      for (const k of Object.keys(data)) delete data[k];\n      Object.assign(data, fresh);\n      for (const t of SCHEMA) data[t.id] ||= [];\n      for (const t of Object.keys(data)) reindex(t);\n      store?.emit('db:reset', {});\n    },\n\n    /** Raw export, used by the CSV/JSON download buttons. */\n    dump: () => data,\n  };\n\n  function tableOf(row) {\n    return String(row.pk || '').replace(/_\\d+$/, '');\n  }\n  function audit(action, t, rec, detail = '') {\n    if (t === 'activity_log') return;\n    const me = store?.get('currentUser');\n    data.activity_log?.unshift({\n      pk: nextPk('activity_log'),\n      company: data.company[0]?.pk,\n      actor: me?.pk || null,\n      action: `${t}.${action}`,\n      target_type: t,\n      target: db.label(t, rec),\n      detail: detail || `${action}d ${TABLES[t]?.label || t}`,\n      created_at: new Date().toISOString().slice(0, 19),\n      ip_address: '10.0.0.12',\n    });\n    if (index.activity_log) index.activity_log.set(data.activity_log[0].pk, data.activity_log[0]);\n  }\n\n  return db;\n}\n\n/* -------------------------------------------------------------- helpers */\nfunction matcher(spec) {\n  const entries = Object.entries(spec).filter(([, v]) => v !== undefined && v !== null && v !== '');\n  return (row) => entries.every(([k, v]) => {\n    const rv = row[k];\n    if (Array.isArray(v)) return v.length === 0 || v.includes(rv);\n    if (v && typeof v === 'object' && 'op' in v) {\n      switch (v.op) {\n        case 'gte': return rv >= v.value;\n        case 'lte': return rv <= v.value;\n        case 'gt':  return rv > v.value;\n        case 'lt':  return rv < v.value;\n        case 'ne':  return rv !== v.value;\n        case 'in':  return (v.value || []).includes(rv);\n        case 'between': return rv >= v.value[0] && rv <= v.value[1];\n        case 'contains': return String(rv ?? '').toLowerCase().includes(String(v.value).toLowerCase());\n        case 'truthy': return !!rv;\n        case 'falsy': return !rv;\n        default: return true;\n      }\n    }\n    return rv === v;\n  });\n}\n\nconst TEXTY = new Set(['string', 'text', 'email', 'phone', 'url', 'slug', 'enum', 'id']);\nfunction defaultSearchFields(t) {\n  return (TABLES[t]?.fields || []).filter(f => TEXTY.has(f.type)).map(f => f.name);\n}\nconst NUMERIC = new Set(['money', 'int', 'float', 'pct']);\nfunction isNumericField(t, name) {\n  return NUMERIC.has(TABLES[t]?.fields.find(f => f.name === name)?.type);\n}\n","app/data/domain.js":"/**\n * domain.js — the platform's business rules, kept out of the UI.\n *\n * Anything that answers \"what does this mean?\" rather than \"how does this look?\"\n * lives here: how a price is built up, when a departure is full, what a refund\n * is worth under a policy, what belongs on a manifest.\n */\nimport { addDays, today, diffDays } from '../core/format.js';\n\nexport function createDomain(db, store) {\n  const co = () => db.all('company')[0];\n\n  const domain = {\n    /* ------------------------------------------------------- capacity */\n    seatsLeft: (av) => Math.max(0, (av?.capacity || 0) - (av?.booked || 0)),\n    fillRate: (av) => (av?.capacity ? (av.booked || 0) / av.capacity : 0),\n    /** open | tight (>=80%) | full | cancelled — drives every colour in the UI. */\n    capacityState(av) {\n      if (!av) return 'open';\n      if (av.status === 'cancelled') return 'cancelled';\n      const left = domain.seatsLeft(av);\n      if (left <= 0) return 'full';\n      return domain.fillRate(av) >= 0.8 ? 'tight' : 'open';\n    },\n    isBookable(av) {\n      if (!av || av.status === 'cancelled' || av.status === 'hidden') return false;\n      if (domain.seatsLeft(av) <= 0) return false;\n      return av.online_status !== 'closed';\n    },\n\n    /* -------------------------------------------------------- pricing */\n    ratesFor: (itemPk) => db.where('customer_type_rate', r => r.item === itemPk && r.is_active),\n\n    /**\n     * Build a full price breakdown from a cart of { rate, qty } lines.\n     * This is the single place a total is computed — the booking wizard, the\n     * booking detail panel and the reports all read the same numbers.\n     */\n    quote({ item, lines = [], promoCode = null, addons = [] }) {\n      const seats = lines.filter(l => l.qty > 0);\n      const subtotal = seats.reduce((s, l) => s + l.rate.total * l.qty, 0);\n      const addonTotal = addons.reduce((s, a) => s + a.price * (a.qty || 1), 0);\n      const pax = seats.reduce((s, l) => {\n        const ct = db.get('customer_type', l.rate.customer_type);\n        return s + (ct?.counts_against_capacity === false ? 0 : l.qty);\n      }, 0);\n      const headcount = seats.reduce((s, l) => s + l.qty, 0);\n\n      let discount = 0, promo = null;\n      if (promoCode) {\n        promo = db.find('promo_code', p =>\n          p.code.toLowerCase() === String(promoCode).trim().toLowerCase() && p.is_active);\n        if (promo) {\n          const today_ = today();\n          if (promo.starts <= today_ && promo.ends >= today_ && promo.used < promo.max_uses) {\n            discount = promo.kind === 'percent'\n              ? Math.round((subtotal + addonTotal) * promo.value / 100)\n              : Math.min(subtotal + addonTotal, promo.value);\n          } else { promo = { ...promo, _invalid: true }; }\n        }\n      }\n\n      const taxable = Math.max(0, subtotal + addonTotal - discount);\n      const taxLines = db.where('tax_fee', t => t.is_active).map(t => {\n        let amount = 0;\n        if (t.calculation === 'percent') amount = Math.round(taxable * t.rate);\n        else if (t.calculation === 'flat_per_booking') amount = t.rate;\n        else if (t.calculation === 'flat_per_customer') amount = t.rate * headcount;\n        return { ...t, amount };\n      }).filter(t => t.amount > 0);\n\n      const taxTotal = taxLines.filter(t => !t.is_inclusive).reduce((s, t) => s + t.amount, 0);\n      const total = taxable + taxTotal;\n      const deposit = item?.deposit_pct ? Math.round(total * item.deposit_pct) : 0;\n\n      return {\n        seats, pax, headcount, subtotal, addonTotal, discount, promo,\n        taxLines, taxTotal, total, deposit, dueNow: deposit || total,\n      };\n    },\n\n    /* ------------------------------------------------ availability search */\n    /** Departures for an item across a date range, ordered for display. */\n    availabilitiesFor(itemPk, from, to) {\n      return db.where('availability', a =>\n        (!itemPk || a.item === itemPk) && a.date >= from && a.date <= to\n      ).sort((a, b) => a.date.localeCompare(b.date) || a.start_time.localeCompare(b.start_time));\n    },\n    /** Everything on a given day, grouped by item — the day view and manifest. */\n    dayBoard(date) {\n      const avs = db.where('availability', a => a.date === date)\n        .sort((a, b) => a.start_time.localeCompare(b.start_time));\n      return avs.map(av => {\n        const bookings = db.children('booking', 'availability', av.pk)\n          .filter(b => b.status !== 'cancelled');\n        return {\n          availability: av,\n          item: db.get('item', av.item),\n          bookings,\n          pax: bookings.reduce((s, b) => s + b.pax, 0),\n          checkedIn: bookings.filter(b => b.is_checked_in).length,\n          resources: db.children('resource_assignment', 'availability', av.pk)\n            .map(ra => ({ ...ra, resource: db.get('resource', ra.resource) })),\n        };\n      });\n    },\n\n    /* --------------------------------------------------- booking writes */\n    /** Create a booking, its seats, its payment, and decrement capacity. */\n    createBooking({ availability, contact, lines, promoCode, payment, channelKind = 'dashboard', notes = '', lodging = null }) {\n      const item = db.get('item', availability.item);\n      const q = domain.quote({ item, lines, promoCode });\n      if (q.pax > domain.seatsLeft(availability))\n        throw new Error(`Only ${domain.seatsLeft(availability)} seat(s) left on this departure.`);\n\n      const channel = db.find('channel', c => c.kind === channelKind) || db.all('channel')[0];\n      const me = store.get('currentUser');\n      const nowIso = new Date().toISOString().slice(0, 19);\n      const code = 'FH-' + (60000 + db.count('booking'));\n\n      const booking = db.insert('booking', {\n        code, company: co().pk, item: item.pk, availability: availability.pk,\n        contact: contact.pk, status: 'confirmed', channel: channel.pk, affiliate: null,\n        pax: q.pax, subtotal: q.subtotal, tax_total: q.taxTotal, discount_total: q.discount,\n        total: q.total, paid: payment ? payment.amount : 0,\n        balance: q.total - (payment ? payment.amount : 0),\n        created_at: nowIso, created_by: me?.pk || null,\n        promo_code: q.promo && !q.promo._invalid ? q.promo.pk : null,\n        lodging, is_checked_in: false,\n        waiver_status: item.requires_waiver ? 'pending' : 'not_required',\n        source_url: '',\n      });\n\n      for (const line of q.seats) {\n        for (let i = 0; i < line.qty; i++) {\n          db.insert('booking_customer', {\n            booking: booking.pk, customer_type_rate: line.rate.pk,\n            name: i === 0 && line === q.seats[0] ? contact.name : '',\n            email: i === 0 && line === q.seats[0] ? contact.email : '',\n            phone: '', price: line.rate.total, checked_in_at: null, waiver_signed: false,\n          }, { log: false });\n        }\n      }\n\n      if (payment && payment.amount > 0) {\n        const fee = ['cash', 'check', 'invoice'].includes(payment.method)\n          ? 0 : Math.round(payment.amount * 0.029) + 30;\n        db.insert('payment', {\n          booking: booking.pk, kind: 'charge', method: payment.method,\n          amount: payment.amount, fee, net: payment.amount - fee, status: 'succeeded',\n          card_brand: payment.method === 'card' ? 'Visa' : '',\n          card_last4: payment.method === 'card' ? '4242' : '',\n          processor_ref: 'ch_' + Math.random().toString(36).slice(2, 12),\n          created_at: nowIso, payout: null, created_by: me?.pk || null,\n        }, { log: false });\n      }\n\n      if (notes.trim()) {\n        db.insert('note', {\n          target_type: 'booking', target: booking.pk, visibility: 'internal',\n          body: notes.trim(), author: me?.pk || null, created_at: nowIso,\n        }, { log: false });\n      }\n\n      if (q.promo && !q.promo._invalid) db.update('promo_code', q.promo.pk, { used: q.promo.used + 1 }, { log: false });\n\n      db.update('availability', availability.pk, {\n        booked: availability.booked + q.pax,\n        status: availability.booked + q.pax >= availability.capacity ? 'sold_out' : availability.status,\n      }, { log: false });\n\n      db.update('contact', contact.pk, {\n        booking_count: contact.booking_count + 1,\n        lifetime_value: contact.lifetime_value + q.total,\n        last_booked: nowIso.slice(0, 10),\n        first_booked: contact.first_booked || nowIso.slice(0, 10),\n      }, { log: false });\n\n      store.emit('booking:created', booking);\n      return booking;\n    },\n\n    /** What a guest gets back if they cancel right now, under the item's policy. */\n    refundQuote(booking) {\n      const item = db.get('item', booking.item);\n      const av = db.get('availability', booking.availability);\n      const policy = db.get('cancellation_policy', item?.cancellation_policy);\n      if (!policy || !av) return { amount: booking.paid, pct: 1, policy: null, withinWindow: true };\n      const hoursOut = diffDays(today(), av.date) * 24;\n      const withinWindow = hoursOut >= policy.cutoff_hours;\n      const pct = withinWindow ? 1 : policy.refund_pct;\n      return { amount: Math.round(booking.paid * pct), pct, policy, withinWindow, hoursOut };\n    },\n\n    cancelBooking(booking, { refundAmount = 0, reason = '' } = {}) {\n      const av = db.get('availability', booking.availability);\n      db.update('booking', booking.pk, { status: 'cancelled', balance: 0 });\n      if (av) db.update('availability', av.pk, {\n        booked: Math.max(0, av.booked - booking.pax),\n        status: av.status === 'sold_out' ? 'open' : av.status,\n      }, { log: false });\n      if (refundAmount > 0) {\n        db.insert('payment', {\n          booking: booking.pk, kind: 'refund', method: 'card',\n          amount: -refundAmount, fee: 0, net: -refundAmount, status: 'succeeded',\n          card_brand: '', card_last4: '', processor_ref: 're_' + Math.random().toString(36).slice(2, 12),\n          created_at: new Date().toISOString().slice(0, 19), payout: null,\n          created_by: store.get('currentUser')?.pk || null,\n        }, { log: false });\n        db.update('booking', booking.pk, { paid: booking.paid - refundAmount }, { log: false });\n      }\n      if (reason) db.insert('note', {\n        target_type: 'booking', target: booking.pk, visibility: 'internal',\n        body: `Cancelled: ${reason}`, author: store.get('currentUser')?.pk || null,\n        created_at: new Date().toISOString().slice(0, 19),\n      }, { log: false });\n      store.emit('booking:cancelled', booking);\n      return booking;\n    },\n\n    takePayment(booking, { amount, method = 'card' }) {\n      const fee = ['cash', 'check', 'invoice'].includes(method) ? 0 : ';\n        });\n        const pays = db.where('payment', p => {\n          const d = p.created_at.slice(0, 10);\n          return d >= a && d <= b && p.status === 'succeeded';\n        });\n        const departures = db.where('availability', v => v.date >= a && v.date <= b && v.status !== 'cancelled');\n        const cap = departures.reduce((s, v) => s + v.capacity, 0);\n        const bkd = departures.reduce((s, v) => s + v.booked, 0);\n        return {\n          bookings: bookings.length,\n          cancelled: cancelled.length,\n          revenue: bookings.reduce((s, b) => s + b.total, 0),\n          collected: pays.filter(p => p.amount > 0).reduce((s, p) => s + p.amount, 0),\n          refunded: -pays.filter(p => p.amount < 0).reduce((s, p) => s + p.amount, 0),\n          fees: pays.reduce((s, p) => s + p.fee, 0),\n          pax: bookings.reduce((s, b) => s + b.pax, 0),\n          avgValue: bookings.length ? Math.round(bookings.reduce((s, b) => s + b.total, 0) / bookings.length) : 0,\n          departures: departures.length,\n          capacity: cap, seatsSold: bkd,\n          utilisation: cap ? bkd / cap : 0,\n          rows: bookings,\n        };\n      };\n\n      const now = window(from, to), prev = window(prevFrom, prevTo);\n      const delta = (k) => prev[k] ? (now[k] - prev[k]) / prev[k] : null;\n      return { now, prev, from, to, prevFrom, prevTo, delta };\n    },\n\n    /** Daily series for the sparklines and trend charts. */\n    series(from, to, valueFn) {\n      const out = [];\n      for (let d = from; d <= to; d = addDays(d, 1)) {\n        const rows = db.where('booking', b => b.created_at.slice(0, 10) === d && b.status !== 'cancelled');\n        out.push({ date: d, value: valueFn ? valueFn(rows) : rows.reduce((s, b) => s + b.total, 0), count: rows.length });\n      }\n      return out;\n    },\n\n    /* ------------------------------------------------ derived worklists */\n    outstandingBalances: () => db.where('booking', b => b.balance > 0 && b oking (B)',\n        onclick: () => router.go('/book'),\n      }),\n      btn('', { kind: 'ghost', icon: '⌘', title: 'Command palette (Ctrl/⌘ K)', onclick: openPalette }),\n      btn('', {\n        kind: 'ghost', icon: store.get('theme') === 'dark' ? '☀' : '☾', title: 'Toggle theme (T)',\n        onclick: toggleTheme,\n      }),\n      h('button.btn.ghost', {\n        onclick: (e) => menu(e.currentTarget, [\n          { label: me?.name || 'Signed in', icon: '👤' },\n          { label: `Role: ${db.label('role', me?.role)}`, icon: '🔑' },\n          'divider',\n          { label: 'Company settings', icon: '⚙', onClick: () => router.go('/settings/company') },\n          { label: 'Users & permissions', icon: '👥', onClick: () => router.go('/users') },\n          { label: 'Switch acting user…', icon: '⇄', onClick: switchUser },\n          'divider',\n          { label: 'Reset demo data', icon: '↻', tone: 'danger', onClick: () => {\n            db.reset(Math.floor(Math.random() * 1e8));\n            toast('Demo data regenerated', { tone: 'ok' });\n            router.go(router.current.path);\n          } },\n        ]),\n      }, avatar(me?.name || '?', true), h('span.small', co?.shortname || ''))));\n  }\n\n  function switchUser() {\n    modal({\n      title: 'Act as another user',\n      sub: 'Permissions in this prototype follow the selected role, so you can see what each teammate sees.',\n      render: (api) => h('div.col',\n        ...db.all('user').filter(u => u.status === 'active').map(u =>\n          h('button.btn.block', {\n            style: { justifyContent: 'flex-start', gap: '10px' },\n            onclick: () => {\n              store.set({ currentUser: u });\n              api.close(); renderTop(); renderSidebar();\n              toast(`Now acting as ${u.name}`, { detail: db.label('role', u.role), tone: 'ok' });\n            },\n          }, avatar(u.name, true), h('span', u.name),\n             h('span.small.muted', { style: { marginLeft: 'auto' } }, db.label(' .label}: ${d.value}`,\n    })));\n}\n\n/** Heatmap grid — used for capacity utilisation by weekday × hour. */\nexport function heatmap(cells, { cols, rowLabels, colLabels, format = num }) {\n  const max = Math.max(...cells.map(c => c.value), 1);\n  return h('div', { style: { overflowX: 'auto' } },\n    h('div', { style: { display: 'grid', gridTemplateColumns: `auto repeat(${cols}, minmax(28px,1fr))`, gap: '2px', minWidth: '420px' } },\n      h('div'),\n      ...colLabels.map(l => h('div', { style: { fontSize: '10px', color: 'var(--fg-subtle)', textAlign: 'center' } }, l)),\n      ...rowLabels.flatMap((rl, ri) => [\n        h('div', { style: { fontSize: '11px', color: 'var(--fg-muted)', paddingRight: '6px', display: 'grid', alignItems: 'center' } }, rl),\n        ...Array.from({ length: cols }, (_, ci) => {\n          const c = cells.find(x => x.row === ri && x.col === ci) || { value: 0 };\n          const a = c.value / max;\n          return h('div', {\n            style: {\n              aspectRatio: '1', borderRadius: '3px', minHeight: '22px',\n              background: a === 0 ? 'var(--surface-3)' : `color-mix(in srgb, var(--primary) ${Math.round(a * 100)}%, transparent)`,\n            },\n            title: `${rl} ${colLabels[ci]}: ${format(c.value)}`,\n          });\n        }),\n      ])));\n}\n","app/core/download.js":"/**\n * download.js — hand a generated file to the person using the page.\n *\n * Two hosts, one call. Served as a normal web page, this creates an object URL\n * and clicks it. Served as a claude.ai Artifact, the frame is not allowed to\n * start a download itself, so it goes through the `downloads` capability, which\n * shows the viewer a confirmation first. Callers do not care which happened.\n */\nlet downloadsPromise;\n\nfunction capability() {\n  if (downloadsPromise === undefined) {\n    downloadsPromise = window.claude?.use\n      ? Promise.resolve(window.claude.use('downloads')).catch(() => null)\n      : Promise.resolve(null);\n  }\n  return downloadsPromise;\n}\n\n/**\n * @returns {Promise<'saved'|'declined'|'failed'>}\n *   'declined' when the viewer said no — that is a normal outcome, not an error.\n */\nexport async function saveFile(filename, data, mime = 'text/plain') {\n  const api = await capability();\n\n  if (api) {\n    try {\n      await api.save({ filename, data });\n      return 'saved';\n    } catch (err) {\n      if (err?.code === 'declined' || err?.code === 'rate_limited') return 'declined';\n      console.warn('download capability refused', err);\n      return 'failed';\n    }\n  }\n\n  try {\n    const url = URL.createObjectURL(new Blob([data], { type: mime }));\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = filename;\n    document.body.append(a);\n    a.click();\n    a.remove();\n    setTimeout(() => URL.revokeObjectURL(url), 4000);\n    return 'saved';\n  } catch (err) {\n    console.warn('download failed', err);\n    return 'failed';\n  }\n}\n\n/** Rows of primitives to an RFC 4180 CSV string. */\nexport function toCsv(headers, rows) {\n  const cell = (v) => `\"${String(v ?? '').replace(/\"/g, '\"\"')}\"`;\n  return [headers.map(cell).join(','), ...rows.map(r => r.map(cell).join(','))].join('\\n');\n}\n","app/core/ui/table.js":"/**\n * table.js — the DataTable every list screen is built from.\n *\n * It owns its own sort/search/filter/page/selection state and re-renders in\n * place, so a module just declares columns and hands it rows.\n *\n *   dataTable({\n *     rows: () => db.query('booking', {...}),   // or a plain array\n *     columns: [\n *       { key:'code', label:'Confirmation', render: r => ... , sortable:true },\n *       { key:'total', label:'Total', align:'num', fmt: money },\n *     ],\n *     filters: [{ key:'status', label:'Status', options:[...] }],\n *     onRowClick: r => openDrawer(r),\n *     selectable: true,\n *     bulkActions: (selected) => [ btn(...) ],\n *     totals: rows => ({ total: sum }),\n *   })\n */\nimport { h, mount } from '../dom.js';\nimport { btn, empty, select as selectEl } from './kit.js';\nimport { num } from '../format.js';\nimport { toast } from './overlay.js';\nimport { saveFile, toCsv } from '../download.js';\n\nexport function dataTable(cfg) {\n  const {\n    columns, rows, filters = [], searchable = true, searchPlaceholder = 'Search…',\n    onRowClick, selectable = false, bulkActions, toolbar, totals,\n    emptyTitle = 'Nothing here yet', emptySub, emptyAction,\n    pageSize: initialPageSize = 25, defaultSort = null, defaultDir = 'asc',\n    exportName = 'export', dense = false, rowClass, onStateChange, initialState = {},\n  } = cfg;\n\n  const state = {\n    search: '', sort: defaultSort, dir: defaultDir, page: 1,\n    pageSize: initialPageSize, filters: {}, selected: new Set(), ...initialState,\n  };\n\n  const host = h('div.dt');\n\n  function resolve() {\n    const res = typeof rows === 'function' ? rows(state) : rows;\n    // A caller can either do its own querying (returning {rows,total,allRows})\n    // or hand over a plain array and let the table do the work.\n    if (Array.isArray(res)) return localQuery(res);\n    return { ...res, allRows: res.allRows || res.rows };\n  }\n\n  function localQuery(all) {\n    let list = all;\n    for (const [k, v] of Object.entries(state.filters)) {\n      if (v === '' || v == null) continue;\n      const fdef = filters.find(f => f.key === k);\n      list = fdef?.apply ? list.filter(r => fdef.apply(r, v)) : list.filter(r => String(r[k]) === String(v));\n    }\n    const q = state.search.trim().toLowerCase();\n    if (q) {\n      list = list.filter(r => columns.some(c => {\n        const v = c.value ? c.value(r) : r[c.key];\n        return v != null && String(v).toLowerCase().includes(q);\n      }));\n    }\n    if (state.sort) {\n      const col = columns.find(c => c.key === state.sort);\n      list = [...list].sort((a, b) => {\n        const av = col?.value ? col.value(a) : a[state.sort];\n        const bv = col?.value ? col.value(b) : b[state.sort];\n        if (av == null) return 1; if (bv == null) return -1;\n        const c = typeof av === 'number' && typeof bv === 'number'\n          ? av - bv : String(av).localeCompare(String(bv), undefined, { numeric: true });\n        return state.dir === 'desc' ? -c : c;\n      });\n    }\n    const total = list.length;\n    const pages = Math.max(1, Math.ceil(total / state.pageSize));\n    const page = Math.min(state.page, pages);\n    return {\n      rows: state.pageSize ? list.slice((page - 1) * state.pageSize, page * state.pageSize) : list,\n      total, page, pages, allRows: list,\n    };\n  }\n\n  function setState(patch) {\n    Object.assign(state, patch);\n    if (!('page' in patch)) state.page = 1;\n    onStateChange?.(state);\n    render();\n  }\n\n  async function exportCsv(allRows) {\n    const cols = columns.filter(c => c.export !== false);\n    const csv = toCsv(\n      cols.map(c => c.label),\n      allRows.map(r => cols.map(c => {\n        if (c.exportFmt) return c.exportFmt(r);\n        const v = c.value ? c.value(r) : r[c.key];\n        return v == null ? '' : String(v);\n      })));\n    const result = await saveFile(`${exportName}.csv`, csv, 'text/csv');\n    if (result === 'saved') toast('Export ready', { detail: `${num(allRows.length)} rows written to ${exportName}.csv`, tone: 'ok' });\n    else if (result === 'failed') toast('Export unavailable here', { detail: 'Downloads are not permitted in this view.', tone: 'warn' });\n  }\n\n  function render() {\n    const { rows: page, total, page: pageNo, pages, allRows } = resolve();\n    const cols = columns.filter(c => !c.hidden);\n\n    const toolbarEl = h('div.dt__toolbar',\n      searchable && h('div.dt__search',\n        h('input.input', {\n          type: 'search', placeholder: searchPlaceholder, value: state.search,\n          oninput: (e) => { state.search = e.target.value; state.page = 1; onStateChange?.(state); rerenderBody(); },\n        })),\n      .

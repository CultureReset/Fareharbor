     btn('›', { size: 'sm', disabled: pageNo >= pages, onclick: () => setState({ page: pageNo + 1 }) }))));\n\n    mount(host, h('div', toolbarEl, bodyWrap));\n    // keep focus in the search box while typing\n    if (document.activeElement === document.body && state.search) {\n      const inp = host.querySelector('.dt__search input');\n      if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }\n    }\n  }\n\n  let bodyTimer = null;\n  function rerenderBody() { clearTimeout(bodyTimer); bodyTimer = setTimeout(render, 130); }\n\n  render();\n  host.refresh = render;\n  host.state = state;\n  return host;\n}\n\nfunction fmtCell(col, row) {\n  const v = col.value ? col.value(row) : row[col.key];\n  if (v == null || v === '') return '—';\n  return col.fmt ? col.fmt(v, row) : String(v);\n}\n","app/modules/_shared.js":"/**\n * _shared.js — cross-section pieces.\n *\n * The booking detail panel is opened from Bookings, Today, Calendar, Check-in,\n * Contacts and Reports, so it lives here rather than in any one of them.\n */\nimport { h, frag } from '../core/dom.js';\nimport { btn, badge, statusBadge, kv, card, tabs, empty, meter, avatar, timeline, banner, chip, checkbox, input, select, simpleTable } from '../core/ui/kit.js';\nimport { drawer, modal, confirm, toast, menu } from '../core/ui/overlay.js';\nimport { dataTable } from '../core/ui/table.js';\nimport * as F from '../core/format.js';\n\n/* ---------------------------------------------------------- date range */\nexport const RANGES = [\n  ['today', 'Today', () => [F.today(), F.today()]],\n  ['7d', 'Last 7 days', () => [F.addDays(F.today(), -6), F.today()]],\n  ['30d', 'Last 30 days', () => [F.addDays(F.today(), -29), F.today()]],\n  ['90d', 'Last 90 days', () => [F.addDays(F.today(), -89), F.today()]],\n  ['mtd', 'Month to date', () => [F.startOfMonth(F.today()), F.today()]],\n  ['next30', 'Next 30 days', () => [F.today(), F.addDays(F.today(), 30)]],\n  ['ytd', 'Year to date', () => [F   ],\n  });\n}\n\nexport function cancelFlow(ctx, b, parent) {\n  const q = ctx.domain.refundQuote(b);\n  let refund = q.amount, reason = '';\n  modal({\n    title: `Cancel ${b.code}`,\n    sub: q.policy ? `${q.policy.name} — ${q.withinWindow ? 'inside the free-cancellation window' : `past cutoff, policy refunds ${F.pct(q.pct)}`}` : '',\n    render: () => h('div.col',\n      banner(q.withinWindow ? 'info' : 'warn',\n        h('div', h('div.strong', `Policy refund: ${F.money(q.amount)}`),\n          h('div.small', `Guest paid ${F.money(b.paid)}. You can override the amount below.`))),\n      h('div.field', h('label', 'Refund amount'),\n        h('input.input', { type: 'number', step: '0.01', value: (refund / 100).toFixed(2),\n          oninput: (e) => { refund = Math.round(Number(e.target.value) * 100); } })),\n      h('div.field', h('label', 'Reason (internal)'),\n        h('textarea.textarea', { placeholder: 'Weather call, guest request, duplicate…', oninput: (e) => { reason = e.target.value; } }))),\n    foot: (api) => [\n      btn('Keep booking', { onclick: api.close }),\n      btn('Cancel & refund', { kind: 'danger', onclick: () => {\n        ctx.domain.cancelBooking(b, { refundAmount: refund, reason });\n        api.close(); parent?.refresh();\n        toast(`${b.code} cancelled`, { detail: refund ? `${F.money(refund)} refunded` : 'No refund issued', tone: 'ok' });\n      } }),\n    ],\n  });\n}\n\nexport function moveBooking(ctx, b, parent) {\n  const { db, domain } = ctx;\n  const from = F.today();\n  const options = domain.availabilitiesFor(b.item, from, F.addDays(from, 90))\n    .filter(a => a.pk !== b.availability && domain.seatsLeft(a) >= b.pax);\n  let target = options[0]?.pk;\n  modal({\n    title: `Move ${b.code}`,\n    sub: `${b.pax} guest(s) on ${db.label('item', b.item)}`,\n    render: () => options.length\n      ? h('div.field', h('label', 'Move to departure'),\n          select(options.map(a => [a.pk, `${F.dateMed(a.date)} · ${F.time12(a.start_tim el: 'Card brand', of: r => r.card_brand || 'Not a card' },\n        payout: { label: 'Payout', of: r => r.payout ? db.label('payout', r.payout) : 'Unsettled' },\n        user: { label: 'Taken by', of: r => r.created_by ? db.label('user', r.created_by) : 'Online' },\n        month: { label: 'Month', of: r => r.created_at.slice(0, 7) },\n      },\n      measures: {\n        count: { label: 'Transactions', of: rs => rs.length, fmt: F.num },\n        amount: { label: 'Amount', of: rs => rs.reduce((s, r) => s + r.amount, 0), fmt: F.money, money: true },\n        fee: { label: 'Fees', of: rs => rs.reduce((s, r) => s + r.fee, 0), fmt: F.money, money: true },\n        net: { label: 'Net', of: rs => rs.reduce((s, r) => s + r.net, 0), fmt: F.money, money: true },\n      },\n    },\n    availability: {\n      label: 'Capacity',\n      desc: 'One row per departure. Use this for utilisation and scheduling questions.',\n      rows: (from, to) => db.where('availability', a => a.date >= from && a.date <= to),\n      dateOf: (r) => r.date,\n      dimensions: {\n        item: { label: 'Item', of: r => db.label('item', r.item) },\n        weekday: { label: 'Day of week', of: r => F.dowName(F.parseISO(r.date).getDay()) },\n        hour: { label: 'Departure hour', of: r => F.time12(r.start_time.slice(0, 2) + ':00') },\n        status: { label: 'Status', of: r => F.titleCase(r.status) },\n        online: { label: 'Online status', of: r => F.titleCase(r.online_status) },\n        month: { label: 'Month', of: r => r.date.slice(0, 7) },\n      },\n      measures: {\n        count: { label: 'Departures', of: rs => rs.length, fmt: F.num },\n        capacity: { label: 'Seats offered', of: rs => rs.reduce((s, r) => s + r.capacity, 0), fmt: F.num },\n        booked: { label: 'Seats sold', of: rs => rs.reduce((s, r) => s + r.booked, 0), fmt: F.num },\n        util: { label: 'Utilisation', of: rs => {\n          const c = rs.reduce((s, r) => s + r.capacity, 0);\n          return c ? rs.reduce((s, query.m || preset?.measures.join(',') || Object.keys(ds.measures).slice(0, 4).join(',')).split(',')\n      .filter(m => ds.measures[m]);\n    const range = rangeOf(ctx, 'range', '90d');\n    const chartType = route.query.chart || 'bar';\n\n    const rows = ds.rows(range.from, range.to);\n    const groups = db.groupBy(rows, dim.of, {})\n      .map(g => {\n        const out = { key: g.key, items: g.items };\n        for (const mid of measureIds) out[mid] = ds.measures[mid].of(g.items);\n        return out;\n      })\n      .sort((a, b) => (b[measureIds[measureIds.length - 1]] ?? 0) - (a[measureIds[measureIds.length - 1]] ?? 0));\n\n    const primary = measureIds.find(m => ds.measures[m].money) || measureIds[measureIds.length - 1];\n    const chartData = groups.slice(0, 14).map(g => ({ label: F.truncate(String(g.key), 18), short: String(g.key).slice(0, 3), value: g[primary] || 0 }));\n\n    /* time series across the range for the trend panel */\n    const series = [];\n    for (let d = range.from; d <= range.to; d = F.addDays(d, 1)) {\n      const dayRows = rows.filter(r => ds.dateOf(r) === d);\n      series.push({ label: d.slice(5), short: d.slice(8), value: ds.measures[primary].of(dayRows) });\n    }\n\n    const setQ = (patch) => router.patchQuery({ ...patch, preset: '' });\n\n    const builder = card({ title: 'Report builder', sub: 'Pick a dataset, a dimension to group by, and the measures to total.' },\n      h('div.grid.c4',\n        h('div.field', h('label', 'Dataset'),\n          select(Object.entries(datasets).map(([k, v]) => [k, v.label]), dsId,\n            v => router.go('/reports', { ds: v, range: range.id })),\n          h('div.hint', ds.desc)),\n        h('div.field', h('label', 'Group by'),\n          select(Object.entries(ds.dimensions).map(([k, v]) => [k, v.label]), dimId, v => setQ({ dim: v }))),\n        h('div.field', h('label', 'Chart'),\n          select([['bar', 'Bars'], ['rank', 'Ranked list'], ['donut', 'Donut'], ['trend', 'Trend over time']], mall.muted', 'A saved report can be emailed on a cadence. Recipients get a CSV plus a link back into the dashboard with the same filters applied.'),\n            simpleTable(['Report', 'To'],\n              saved.filter(s => s.schedule !== 'none').map(s => [s.name, h('span.small', (s.recipients || []).join(', ') || '—')]))),\n          card({ title: 'What each dataset answers' },\n            h('div.col', { style: { gap: '10px' } },\n              ...Object.entries(datasets).map(([k, v]) => h('div',\n                h('div.small.strong', v.label), h('div.small.muted', v.desc)))))))\n    );\n  },\n};\n\nasync function exportReport(dim, ds, measureIds, groups) {\n  const csv = toCsv(\n    [dim.label, ...measureIds.map(m => ds.measures[m].label)],\n    groups.map(g => [g.key, ...measureIds.map(m => g[m])]));\n  const result = await saveFile('report.csv', csv, 'text/csv');\n  if (result === 'saved') toast('Report exported', { detail: `${groups.length} rows`, tone: 'ok' });\n  else if (result === 'failed') toast('Export unavailable here', { detail: 'Downloads are not permitted in this view.', tone: 'warn' });\n}\n\nfunction saveReport(ctx, cfg) {\n  const { db } = ctx;\n  let name = '', schedule = 'none', recipient = ctx.store.get('currentUser')?.email || '';\n  modal({\n    title: 'Save this report',\n    sub: 'Saves the definition — dataset, grouping and measures — not a snapshot of the numbers.',\n    render: () => h('div.col',\n      h('div.field', h('label', 'Report name'),\n        h('input.input', { placeholder: 'Weekly channel mix', oninput: e => { name = e.target.value; } })),\n      h('div.field', h('label', 'Email delivery'),\n        select([['none', 'Do not send'], ['daily', 'Every morning'], ['weekly', 'Every Monday'], ['monthly', 'First of the month']],\n          schedule, v => { schedule = v; })),\n      h('div.field', h('label', 'Send to'),\n        h('input.input', { value: recipient, oninput: e => { recipient = e.target.value; } }))),\n    foot: (api) => [btn('Cancel', { onclick: api.close }),\n      btn('Save report', { kind: 'primary', onclick: () => {\n        if (!name.trim()) return toast('Name the report', { tone: 'warn' });\n        db.insert('saved_report', {\n          company: ctx.domain.company().pk, name: name.trim(), base: cfg.dsId,\n          columns: cfg.measureIds, filters: { range: cfg.range }, group_by: cfg.dimId,\n          schedule, recipients: schedule === 'none' ? [] : [recipient],\n          owner: ctx.store.get('currentUser')?.pk,\n        });\n        api.close(); toast('Report saved', { tone: 'ok' });\n      } })],\n  });\n}\n","app/modules/users.js":"import { h } from '../core/dom.js';\nimport { pageHead, card, btn, badge, statusBadge, stat, empty, select, simpleTable, kv, toggle, tabs, avatar, checkbox } from '../core/ui/kit.js';\nimport { dataTable } from '../core/ui/table.js';\nimport { drawer, modal, toast, confirm } from '../core/ui/overlay.js';\nimport { moduleIntro } from './_shared.js';\nimport * as F from '../core/format.js';\n\n/** The permission surface, grouped the way the settings screen groups it. */\nconst PERMISSIONS = [\n  ['Bookings', [\n    ['bookings.view', 'See bookings'],\n    ['bookings.create', 'Create bookings'],\n    ['bookings.edit', 'Edit and move bookings'],\n    ['bookings.cancel', 'Cancel bookings'],\n  ]],\n  ['Money', [\n    ['payments.charge', 'Take payments'],\n    ['payments.refund', 'Issue refunds'],\n    ['payments.view', 'See transactions'],\n    ['payouts.view', 'See payouts and bank details'],\n  ]],\n  ['Catalog', [\n    ['items.view', 'See items'],\n    ['items.edit', 'Edit items and pricing'],\n    ['availability.edit', 'Add and change departures'],\n  ]],\n  ['Operations', [\n    ['manifest.view', 'See manifests'],\n    ['checkin.edit', 'Check guests in'],\n    ['resources.edit', 'Assign resources'],\n  ]],\n  ['Guests', [\n    ['contacts.view', 'See contact records'],\n    ['contacts.edit', 'Edit and merge contacts'],\n    ['messaging.send', 'Send guest messages'],\n  ]],\n  ['Administration', [\n    ['reports.view', 'Run reports'],\n    ['exports.create', 'Export data'],\n    ['users.manage', 'Manage users and roles'],\n    ['settings.manage', 'Change company settings'],\n  ]],\n];\n\nconst has = (role, key) => {\n  const p = role?.permissions || [];\n  if (p.includes('*')) return true;\n  if (p.includes(key)) return true;\n  const [area, verb] = key.split('.');\n  if (p.includes(`${area}.*`)) return true;\n  if (p.includes('*.view') && verb === 'view') return true;\n  return false;\n};\n\nexport default {\n  id: 'users',\n  title: 'Users & Roles',\n  icon: '👥',\n  group: 'Admin',\n  order: 220,\n  summary: 'Who can log in, what each role may do, and the permission matrix behind it.',\n  entities: ['user', 'role'],\n\n  render(ctx) {\n    const { db, router, route, store } = ctx;\n    const tab = route.query.tab || 'users';\n    const users = db.all('user');\n    const roles = db.all('role');\n    const me = store.get('currentUser');\n\n    const TABS = [\n      { id: 'users', title: 'Users', count: users.length },\n      { id: 'roles', title: 'Roles', count: roles.length },\n      { id: 'matrix', title: 'Permission matrix' },\n    ];\n\n    const panes = {\n      users: () => card({ flush: true }, dataTable({\n        rows: users,\n        exportName: 'users',\n        searchPlaceholder: 'Name, email or role…',\n        onRowClick: (u) => openUser(ctx, u),\n        columns: [\n          { key: 'name', label: 'User', render: u => h('div.row', { style: { gap: '9px' } },\n            avatar(u.name, true),\n            h('div', h('div.strong', u.name, u.pk === me?.pk ? h('span.small.muted', ' (you)') : null),\n              h('div.small.muted', u.email))) },\n          { key: 'role', label: 'Role', value: u => db.label('role', u.role),\n            render: u => badge(db.label('role', u.role), 'info') },\n          { key: 'status', label: 'Status', render: u => statusBadge(u.status) },\n          { key: ermission against every role', flush: true },\n        simpleTable(\n          ['Permission', ...roles.map(r => ({ label: r.name, align: 'num' }))],\n          PERMISSIONS.flatMap(([group, perms]) => [\n            [h('span.small.strong', { style: { textTransform: 'uppercase', letterSpacing: '.06em', color: 'var(--fg-subtle)' } }, group),\n             ...roles.map(() => '')],\n            ...perms.map(([key, label]) => [\n              h('div', h('div', label), h('div.small.mono.subtle', key)),\n              ...roles.map(r => has(r, key)\n                ? h('span', { style: { color: 'var(--ok)', fontWeight: 700 } }, '✓')\n                : h('span.subtle', '·')),\n            ]),\n          ]))),\n    };\n\n    return h('div.page',\n      pageHead({\n        title: 'Users & Roles',\n        sub: 'Access control for the dashboard.',\n        actions: [btn('Invite a user', { kind: 'primary', icon: '＋', onclick: () => inviteUser(ctx) })],\n      }),\n      moduleIntro(this, 'Try the “Act as another user” option in the account menu to see the dashboard as a guide or an accountant rather than an owner.'),\n      h('div.grid.c4.mb-4',\n        stat({ label: 'Users', value: F.num(users.length) }),\n        stat({ label: 'Active', value: F.num(users.filter(u => u.status === 'active').length) }),\n        stat({ label: 'Pending invitations', value: F.num(users.filter(u => u.status === 'invited').length) }),\n        stat({ label: '2FA coverage',\n          value: F.pct(users.length ? users.filter(u => u.two_factor).length / users.length : 0, 0),\n          tone: users.filter(u => u.two_factor).length < users.length ? 'warn' : 'ok' })),\n      tabs(TABS, tab, id => router.patchQuery({ tab: id })),\n      h('div.mt-4', panes[tab]()));\n  },\n};\n\nfunction openUser(ctx, u) {\n  const { db, store } = ctx;\n  const role = db.get('role', u.role);\n  drawer({\n    title: u.name,\n    sub: u.email,\n    badge: statusBadge(u.status),\n    render: (api) => h('div.col', { style: { gap: 'var(--sp-4)' } },\n      card({ title: 'Account' }, h('div.grid.c2',\n        h('div.field', h('label', 'Name'), h('input.input', { value: u.name, onchange: e => db.update('user', u.pk, { name: e.target.value }) })),\n        h('div.field', h('label', 'Email'), h('input.input', { value: u.email, onchange: e => db.update('user', u.pk, { email: e.target.value }) })),\n        h('div.field', h('label', 'Phone'), h('input.input', { value: u.phone || '', onchange: e => db.update('user', u.pk, { phone: e.target.value }) })),\n        h('div.field', h('label', 'Role'),\n          select(db.all('role').map(r => [r.pk, r.name]), u.role, v => { db.update('user', u.pk, { role: v }); api.refresh(); })),\n        h('div.field', h('label', 'Status'),\n          select(['active', 'invited', 'disabled'], u.status, v => { db.update('user', u.pk, { status: v }); api.refresh(); })),\n        h('div.field', h('label', 'Two-factor authentication'),\n          toggle(u.two_factor, v => db.update('user', u.pk, { two_factor: v }))))),\n      card({ title: 'Location restriction' },\n        h('p.small.muted', 'Leave everything unticked to give this user access to every location.'),\n        h('div.col.mt-2', ...db.all('location').map(l =>\n          checkbox(l.name, (u.location_scope || []).includes(l.pk), v => {\n            const next = v ? [...(u.location_scope || []), l.pk] : (u.location_scope || []).filter(x => x !== l.pk);\n            db.update('user', u.pk, { location_scope: next });\n          })))),\n      card({ title: `What ${u.name.split(' ')[0]} can do`, sub: role?.name },\n        h('div.col', ...PERMISSIONS.map(([group, perms]) => h('div',\n          h('div.small.strong.mb-2', group),\n          h('div.row', { style: { gap: '4px' } },\n            ...perms.map(([key, label]) => badge(label, has(role, key) ? 'ok' : ''))))))),\n      card({ title: 'Recent activity', flush: true },\n        (() => {\n          const log = db.where('activity_log', a => a.actor === u.pk).sl g references')),\n      card({ title: 'Points at this table', sub: 'Foreign keys arriving here', flush: true },\n        incoming.length ? simpleTable(['Source table', 'Field', 'Meaning'],\n          incoming.map(e => [\n            h('a.mono', { href: `#/datamodel/table/${e.from}` }, e.from),\n            h('span.mono', e.via),\n            h('span.small.muted', `${TABLES[e.from].label} → ${e.label}`),\n          ])) : empty('Nothing references this table'))),\n\n    shape: () => card({ title: 'Example row', sub: 'The first row currently in memory' },\n      rows.length ? codeBlock(JSON.stringify(rows[0], null, 2)) : empty('No rows')),\n  };\n\n  return h('div.page',\n    pageHead({\n      breadcrumb: h('a', { href: '#/datamodel' }, '‹ Data model'),\n      title: t.label,\n      sub: t.desc,\n      actions: [badge(t.group, 'info'), badge(`${F.num(rows.length)} rows`)],\n    }),\n    h('div.banner.info.mb-4', h('span', '🗄'),\n      h('div', h('div.strong', h('span.mono', t.id)),\n        h('div.small', `${t.fields.length} fields · ${outgoing.length} outgoing references · ${incoming.length} tables reference it`))),\n    tabs(TABS, tab, tid => router.patchQuery({ tab: tid })),\n    h('div.mt-4', panes[tab]()));\n}\n\nfunction cellFor(ctx, f, v) {\n  if (v === null || v === undefined || v === '') return h('span.muted', '—');\n  switch (f.type) {\n    case 'money': return F.money(v);\n    case 'pct': return F.pct(v, 1);\n    case 'bool': return v ? badge('true', 'ok') : badge('false');\n    case 'date': return F.dateShort(v);\n    case 'datetime': return h('span.small', F.dateShort(String(v).slice(0, 10)));\n    case 'time': return F.time12(v);\n    case 'enum': return badge(F.titleCase(v));\n    case 'ref': return h('a.mono.small', { href: `#/datamodel/table/${f.ref}` }, String(v));\n    case 'array': return h('span.small', Array.isArray(v) ? v.slice(0, 3).join(', ') + (v.length > 3 ? ` +${v.length - 3}` : '') : String(v));\n    case 'json': return h('span.mono.small', const dirname = (p) => p.slice(0, p.lastIndexOf('/'));
const resolve = (from, spec) => {
  const parts = (dirname(from) + '/' + spec).split('/');
  const out = [];
  for (const seg of parts) {
    if (seg === '.' || seg === '') continue;
    if (seg === '..') out.pop();
    else out.push(seg);
  }
  return out.join('/');
};

const urls = Object.create(null);
for (const path of ORDER) {
  const code = SRC[path].replace(
    /(from\s*|import\s*)(['"])(\.{1,2}\/[^'"]+)\2/g,
    (m, kw, q, spec) => kw + q + urls[resolve(path, spec)] + q

  urls[path] = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
